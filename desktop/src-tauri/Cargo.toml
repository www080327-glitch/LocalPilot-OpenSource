[package]
name = "localpilot-desktop"
version = "5.0.1-rc.7"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
base64 = "0.22"
sha2 = "0.10"
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
semver = "1"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["time", "sync"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"
libc = "0.2"
window-vibrancy = "0.8.1"
block2 = "0.6.2"
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace", "NSAccessibility", "NSAlert", "NSTextField", "NSSecureTextField", "NSControl", "NSButton", "NSWindow", "NSApplication", "NSEvent", "block2", "NSBezierPath", "NSView", "NSGlassEffectView", "objc2-core-graphics", "objc2-quartz-core"] }

objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAShapeLayer", "CATransaction", "objc2-core-graphics"] }

# Keep host proc-macro Mach-O string tables valid on the installed macOS linker.
[profile.release]
strip = false
[profile.release.build-override]
debug = true
